<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Map Editor</title>
<style>
  :root {
    --bg: #15171c; --panel: #1d2027; --line: #2c313b; --text: #e3e6ec;
    --muted: #8b93a3; --accent: #e0b84a; --sel: #2d3442; --bad: #ff7b72; --good: #7ee787;
  }
  * { box-sizing: border-box; }
  #failDialog { position: fixed; inset: 0; background: #000a; z-index: 80; display: none; align-items: center; justify-content: center; }
  #failDialog .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; width: min(620px, 94vw); padding: 16px 18px; max-height: 88vh; overflow: auto; }
  #failDialog h2 { margin: 0 0 8px; font-size: 16px; }
  #failDialog pre { background: #0b0c0f; padding: 8px; border-radius: 6px; font: 11px/1.4 ui-monospace, monospace; max-height: 240px; overflow: auto; white-space: pre-wrap; }
  #failDialog .row { display: flex; gap: 8px; margin-top: 12px; }
  body.busy, body.busy * { cursor: progress !important; }
  body.busy #status::after { content: ' · working…'; color: var(--accent); }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 13px/1.4 -apple-system, system-ui, sans-serif; height: 100vh;
         display: grid; grid-template-columns: 1fr 320px; grid-template-rows: auto 1fr auto; }
  header { grid-column: 1 / 3; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
           padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0; color: var(--accent); font-weight: 600; }
  header a { color: var(--muted); text-decoration: none; } header a:hover { color: var(--text); }
  .group { display: flex; gap: 6px; align-items: center; }
  .group label { display: flex; gap: 4px; align-items: center; color: var(--muted); }
  select, input[type=search], input[type=number] { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; font: inherit; }
  button { background: #2a2f3a; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { background: #343a47; } button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #4a3d12; border-color: #8a6d1f; }
  .tools button.on { background: var(--sel); border-color: var(--accent); color: var(--accent); }
  main { overflow: auto; position: relative; background: #0b1a4a; }
  #world { position: relative; transform-origin: 0 0; user-select: none; -webkit-user-select: none; }
  #world img.ch { position: absolute; image-rendering: pixelated; display: block; -webkit-user-drag: none; }
  #world img.ov { position: absolute; image-rendering: pixelated; pointer-events: none; }
  #marks, #pend { position: absolute; inset: 0; pointer-events: none; }
  .icon { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; cursor: pointer; text-align: center; white-space: nowrap; }
  .icon img { image-rendering: pixelated; display: block; margin: 0 auto; filter: drop-shadow(0 0 2px #000); }
  .icon span { font-size: 11px; background: #000b; color: #fff; padding: 0 4px; border-radius: 3px; }
  .icon.sel span { background: var(--accent); color: #000; }
  #world.far .icon span { display: none; } #world.far .icon:hover span, #world.far .icon.sel span { display: inline; }
  .icon:hover { z-index: 2; }
  .icon.nowhere span { color: var(--bad); }
  .step { position: absolute; border: 2px solid #58a6ff; background: #58a6ff33; pointer-events: auto; }
  .step.nowhere { border-color: var(--bad); background: #ff7b7233; }
  .step.sel { border-color: #e0b84a; background: #e0b84a44; }
  .arr { position: absolute; transform: translate(-50%, -50%); width: 16px; height: 16px; border-radius: 8px; background: #7ee787; color: #000;
         font-size: 9px; font-weight: 700; text-align: center; line-height: 16px; pointer-events: none; }
  .pv { position: absolute; image-rendering: pixelated; outline: 1px solid var(--accent); }
  #side { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; overflow: auto; }
  #side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 12px 6px; font-weight: 600; }
  .pane { padding: 0 12px 10px; } .note { color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 6px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  #atlasWrap { max-height: 46vh; overflow: auto; border: 1px solid var(--line); }
  #atlas { image-rendering: pixelated; display: block; cursor: pointer; width: 288px; }
  #recent { display: flex; gap: 3px; flex-wrap: wrap; min-height: 20px; }
  #recent canvas, #pickCv { image-rendering: pixelated; border: 1px solid var(--line); cursor: pointer; }
  .kinds button { display: flex; gap: 6px; align-items: center; width: 100%; text-align: left; margin-bottom: 4px; }
  .kinds button.on { border-color: var(--accent); background: var(--sel); }
  .battle { border: 1px solid var(--line, #3334); border-radius: 6px; padding: 8px; margin: 8px 0; }
  .battle .grp { display: flex; gap: 4px; align-items: center; margin: 3px 0; }
  .battle .grp select { flex: 1; min-width: 0; }
  .battle .grp input { width: 46px; }
  .kinds i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid #0006; flex: none; }
  footer { grid-column: 1 / 3; padding: 4px 12px; background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); min-height: 24px; }
  .ok { color: var(--good); } .err { color: var(--bad); } .warn { color: var(--accent); }
  body:not(.advanced) .adv { display: none !important; }
  #picker { position: fixed; inset: 0; background: #000a; z-index: 50; display: none; align-items: center; justify-content: center; }
  #picker .pk { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; width: min(1100px, 94vw); height: min(760px, 90vh);
    display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
  #picker .pkHead, #picker .pkFoot { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  #picker .pkFoot { border-bottom: 0; border-top: 1px solid var(--line); justify-content: flex-end; }
  #picker .pkBody { display: grid; grid-template-columns: 260px 1fr; min-height: 0; }
  #pkList { overflow: auto; border-right: 1px solid var(--line); }
  #pkList div { padding: 5px 10px; cursor: pointer; font-size: 13px; } #pkList div:hover, #pkList div.on { background: var(--sel); } #pkList div.on { color: var(--accent); }
  #pkMapWrap { overflow: auto; position: relative; background: #0b0c0f; }
  #pkMap { position: relative; display: inline-block; } #pkImg { image-rendering: pixelated; display: block; }
  #pkDots button { position: absolute; transform: translate(-50%, -50%); min-width: 26px; height: 26px; border-radius: 13px; padding: 0 6px;
    background: #58a6ff; color: #0b0c0f; font-weight: 700; border: 2px solid #fff; cursor: pointer; }
  #pkDots button.on { background: var(--accent); }
</style>
</head>
<body>
<header>
  <a href="/" title="Back to the towns and dungeons">← Places</a>
  <a href="/atlas.html" title="Every place on one map, joined by its doors">Atlas</a>
  <h1>World map</h1>
  <div class="group"><label>Zoom <select id="zoom"><option value="0.25">¼</option><option value="0.5" selected>½</option><option value="1">1</option><option value="2">2</option></select></label></div>
  <div class="group">
    <label><input type="checkbox" id="ovWalk"> Walkability</label>
    <label><input type="checkbox" id="ovKind"> Encounter regions</label>
    <label><input type="checkbox" id="ovPlaces" checked> Places</label>
  </div>
  <div class="group tools" id="tools">
    <button data-tool="view" class="on" title="Look around; click a town to see where it leads (V)">View</button>
    <button data-tool="ground" title="Paint ground blocks (G)">Ground</button>
    <button data-tool="overlay" title="Paint overlay blocks: mountains, trees, coast (O)">Overlay</button>
    <button data-tool="region" title="Paint encounter regions (R)">Regions</button>
    <button data-tool="icons" title="Drag towns and dungeons to move them (T)">Towns</button>
    <button data-tool="steps" title="Make, change or remove spots that lead somewhere when stepped on (P)">Step spots</button>
  </div>
  <div class="group">
    <button id="undo" disabled title="Undo (⌘Z)">Undo</button>
    <button id="redo" disabled title="Redo (⇧⌘Z)">Redo</button>
    <button id="build" class="adv" title="Build the game without opening it">Build</button><button id="resetWorld" title="Put the world map back as the original game has it">Reset world map…</button>
    <button id="play" class="primary" title="Build and open your game on the world map">▶ Play</button>
    <label title="Show raw numbers and codes"><input type="checkbox" id="advanced"> Advanced</label>
    <label title="The editor's language. The game stays in English.">🌐 <select id="lang" style="width:auto"></select></label>
  </div>
</header>
<main id="view"><div id="world"><div id="tiles"></div><div id="walkL"></div><div id="kindL"></div><div id="pend"></div><div id="marks"></div></div></main>
<div id="side">
  <h2 id="toolTitle">Look around</h2>
  <div class="pane" id="toolHelp"></div>
  <div class="pane" id="blockPane" style="display:none">
    <div class="row"><canvas id="pickCv" width="16" height="16" style="width:32px;height:32px"></canvas><span id="pickText" class="note">Pick a block, or ⌥-click the map</span></div>
    <div class="note">Recently used</div><div id="recent"></div>
    <div id="atlasWrap" style="margin-top:6px"><img id="atlas" alt=""></div>
  </div>
  <div class="pane kinds" id="kindPane" style="display:none"></div>
  <div class="pane" id="battlePane" style="display:none"></div>
  <div class="pane" id="newIconPane" style="display:none">
    <div class="note">New town icon</div>
    <div class="row"><img id="newIconImg" alt="" style="height:32px;image-rendering:pixelated"><select id="newIconSprite"></select></div>
    <div class="row"><button id="newIconGo">Place a new icon…</button></div>
  </div>
  <div class="pane" id="iconPane" style="display:none">
    <div id="iconInfo"></div>
    <div class="row"><button id="iconLink" class="primary">Change where it leads…</button><button id="stepWiden" style="display:none" title="Then click squares next to it to make the spot bigger">Add a square…</button><button id="stepRemove" style="display:none">Remove spot</button><button id="iconRemove" style="display:none">Remove icon</button></div>
    <label class="note"><input type="checkbox" id="moveArrivals" checked> When moving, move its arrival points too (where you appear on leaving)</label>
  </div>
</div>
<footer id="status">Loading the world…</footer>

<div id="picker"><div class="pk">
  <div class="pkHead"><b>Where should this lead?</b><input id="pkFilter" type="search" placeholder="Find a place" style="flex:1"></div>
  <div class="pkBody"><div id="pkList"></div>
    <div id="pkMapWrap"><div id="pkHint" class="note" style="padding:12px">Pick a place on the left, then click where the party should arrive.</div>
      <div id="pkArrivals"></div><div id="pkMap"><img id="pkImg" alt=""><div id="pkDots"></div></div></div></div>
  <div class="pkFoot"><span id="pkSel" style="margin-right:auto;color:var(--muted)"></span><button id="pkCancel">Cancel</button><button id="pkOk" class="primary" disabled>Link</button></div>
</div></div>

<script src="i18n-strings.js"></script>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script src="world.js"></script>
</body>
</html>
